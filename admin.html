<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hidden Laws Admin</title><style>:root{--bg:#0a0f10;--panel:#131b1a;--ink:#f4efe5;--muted:#aaa99f;--gold:#c8a35a;--line:rgba(234,214,156,.16)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#090e0f,#101716);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}.wrap{max-width:860px;margin:auto;padding:48px 18px}.card{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:22px;padding:24px;margin-bottom:18px;box-shadow:0 24px 70px rgba(0,0,0,.22)}h1{font-family:Georgia,serif;font-weight:500;color:#ead69c;font-size:2.6rem;margin-top:0}label{display:block;margin:16px 0 7px;color:#e5ddcf;font-weight:700}input,textarea{width:100%;background:#0d1414;border:1px solid var(--line);border-radius:13px;color:#fff;padding:13px 14px;outline:none}input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,163,90,.09)}textarea{min-height:120px;resize:vertical}.btn{background:linear-gradient(180deg,#d6b66e,#bd934a);color:#151913;border:0;border-radius:999px;padding:12px 20px;font-weight:800;cursor:pointer}.muted,.status{color:var(--muted)}#editor{display:none}</style></head><body><div class="wrap"><h1>Hidden Laws Admin</h1><div class="card" id="login"><p class="muted">Enter the Cloudflare admin password.</p><input id="password" type="password" placeholder="Admin password"><p><button class="btn" id="loginBtn">Log in</button></p><div class="status" id="loginStatus"></div></div><div id="editor"><form class="card" id="form"><label>Hero kicker</label><input name="heroKicker"><label>Hero title</label><input name="heroTitle"><label>Hero lead</label><textarea name="heroLead"></textarea><label>Mission</label><textarea name="mission"></textarea><label>Mission body</label><textarea name="missionBody"></textarea><label>About title</label><input name="aboutTitle"><label>About body</label><textarea name="aboutBody"></textarea><label>Booking intro</label><textarea name="bookingIntro"></textarea><p><button class="btn" type="submit">Save changes</button></p><div class="status" id="saveStatus"></div></form></div></div><script>const $=s=>document.querySelector(s),form=$('#form');async function load(){const r=await fetch('/api/admin/content');if(!r.ok)throw new Error('Not logged in');const c=await r.json();for(const[k,v]of Object.entries(c)){if(form.elements[k])form.elements[k].value=v}$('#login').style.display='none';$('#editor').style.display='block'}$('#loginBtn').onclick=async()=>{const s=$('#loginStatus');s.textContent='Signing in…';const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#password').value})});const j=await r.json().catch(()=>({}));if(!r.ok){s.textContent=j.error||'Login failed';return}s.textContent='';await load()};form.onsubmit=async e=>{e.preventDefault();const s=$('#saveStatus');s.textContent='Saving…';const data=Object.fromEntries(new FormData(form));const r=await fetch('/api/admin/content',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));s.textContent=r.ok?'Saved. Public content is now updated.':(j.error||'Save failed')};load().catch(()=>{});</script></body></html>
