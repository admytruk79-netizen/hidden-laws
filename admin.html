<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hidden Laws Admin</title><style>body{margin:0;background:#0b0f15;color:#f3efe6;font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:860px;margin:auto;padding:38px 18px}.card{background:#121923;border:1px solid rgba(208,170,101,.22);border-radius:18px;padding:22px;margin-bottom:18px}h1{font-family:Georgia,serif;font-weight:500;color:#d0aa65}label{display:block;margin:14px 0 6px;color:#d8d0c3;font-weight:700}input,textarea{width:100%;box-sizing:border-box;background:#0e141c;border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;padding:12px}textarea{min-height:120px}.btn{background:#d0aa65;color:#111;border:0;border-radius:999px;padding:11px 18px;font-weight:800;cursor:pointer}.muted{color:#aaa}#editor{display:none}.status{margin-top:10px;color:#cfc7ba}</style></head><body><div class="wrap"><h1>Hidden Laws Admin</h1><div class="card" id="login"><p class="muted">Enter the Cloudflare admin password.</p><input id="password" type="password" placeholder="Admin password"><p><button class="btn" id="loginBtn">Log in</button></p><div class="status" id="loginStatus"></div></div><div id="editor"><form class="card" id="form"><label>Hero kicker</label><input name="heroKicker"><label>Hero title</label><input name="heroTitle"><label>Hero lead</label><textarea name="heroLead"></textarea><label>Mission</label><textarea name="mission"></textarea><label>Mission body</label><textarea name="missionBody"></textarea><label>About title</label><input name="aboutTitle"><label>About body</label><textarea name="aboutBody"></textarea><label>Booking intro</label><textarea name="bookingIntro"></textarea><p><button class="btn" type="submit">Save changes</button></p><div class="status" id="saveStatus"></div></form></div></div><script>
const $=s=>document.querySelector(s),form=$('#form');
async function load(){const r=await fetch('/api/admin/content');if(!r.ok)throw new Error('Not logged in');const c=await r.json();for(const [k,v] of Object.entries(c)){if(form.elements[k])form.elements[k].value=v}$('#login').style.display='none';$('#editor').style.display='block'}
$('#loginBtn').onclick=async()=>{const s=$('#loginStatus');s.textContent='Signing in…';const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#password').value})});const j=await r.json().catch(()=>({}));if(!r.ok){s.textContent=j.error||'Login failed';return}s.textContent='';await load()};
form.onsubmit=async e=>{e.preventDefault();const s=$('#saveStatus');s.textContent='Saving…';const data=Object.fromEntries(new FormData(form));const r=await fetch('/api/admin/content',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));s.textContent=r.ok?'Saved. Public content is now updated.':(j.error||'Save failed')};
load().catch(()=>{});
</script></body></html>
