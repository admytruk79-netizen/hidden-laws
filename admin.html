<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe5"><title>Hidden Laws Admin</title><style>:root{--paper:#f4efe5;--cream:#fbf8f2;--ink:#18231f;--muted:#667068;--forest:#1f352d;--gold:#aa8248;--line:rgba(31,53,45,.16);--shadow:0 24px 70px rgba(36,45,39,.10)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f3eb,var(--paper));color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:42px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.brand{display:flex;align-items:center;gap:10px;font-weight:820;letter-spacing:.15em}.mark{width:30px;height:30px;border:1px solid rgba(170,130,72,.55);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:.68rem}.site-link{color:#6d5226;font-weight:760;font-size:.9rem}.card{background:rgba(255,255,255,.62);border:1px solid var(--line);border-radius:24px;padding:26px;margin-bottom:18px;box-shadow:var(--shadow)}h1{font-size:clamp(2.4rem,6vw,4rem);font-weight:380;letter-spacing:-.045em;margin:8px 0 4px}h2{font-size:1rem;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);margin:0 0 18px}.muted,.status{color:var(--muted)}label{display:block;margin:17px 0 7px;color:#33413a;font-weight:750}input,textarea{width:100%;background:#fffdf8;border:1px solid rgba(31,53,45,.2);border-radius:13px;color:var(--ink);padding:13px 14px;outline:none}input:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(170,130,72,.10)}textarea{min-height:118px;resize:vertical}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;background:var(--forest);color:#fff;border:0;border-radius:999px;padding:11px 19px;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.06)}#editor{display:none}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.status{min-height:24px;margin-top:10px}.note{font-size:.86rem;color:#7b837d;margin-top:10px}.inbox{display:grid;gap:12px}.inquiry{background:#fffdf8;border:1px solid var(--line);border-radius:16px;padding:16px}.inquiry-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.inquiry strong{font-size:1rem}.inquiry time{font-size:.82rem;color:var(--muted)}.inquiry .email{font-size:.88rem;color:#6d5226;font-weight:700}.inquiry .subject{margin:10px 0 5px;font-weight:800}.inquiry .message{white-space:pre-wrap;color:#46524b}.empty{color:var(--muted);font-size:.95rem}@media(max-width:640px){.wrap{padding:26px 14px 50px}.top{align-items:flex-start;flex-direction:column}.card{padding:20px}}</style></head><body><div class="wrap"><div class="top"><div class="brand"><span class="mark">HL</span><span>HIDDEN LAWS ADMIN</span></div><a class="site-link" href="/">View public site →</a></div><h1>Website content</h1><p class="muted">Edit the key public copy and review contact inquiries.</p><div class="card" id="login"><h2>Admin access</h2><p class="muted">Enter the Cloudflare admin password.</p><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"><div class="row" style="margin-top:14px"><button class="btn" id="loginBtn" type="button">Log in</button></div><div class="status" id="loginStatus" aria-live="polite"></div></div><div id="editor"><div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Contact inquiries</h2><button class="btn" id="refreshInbox" type="button">Refresh</button></div><div class="status" id="inboxStatus" aria-live="polite"></div><div class="inbox" id="inbox"></div></div><form class="card" id="form"><h2>Editable copy</h2><label>Hero kicker</label><input name="heroKicker"><label>Hero title</label><input name="heroTitle"><label>Hero lead</label><textarea name="heroLead"></textarea><label>Mission</label><textarea name="mission"></textarea><label>Mission body</label><textarea name="missionBody"></textarea><label>About title</label><input name="aboutTitle"><label>About body</label><textarea name="aboutBody"></textarea><label>Booking intro</label><textarea name="bookingIntro"></textarea><div class="row" style="margin-top:20px"><button class="btn" type="submit">Save changes</button></div><div class="status" id="saveStatus" aria-live="polite"></div><div class="note">Changes are stored in the CONTENT KV binding and appear on the public site without a code change.</div></form></div></div><script>const $=s=>document.querySelector(s),form=$('#form');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function loadInbox(){const s=$('#inboxStatus'),box=$('#inbox');s.textContent='Loading…';const r=await fetch('/api/admin/inquiries',{cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok){s.textContent=j.error||'Unable to load inquiries';return}const items=j.inquiries||[];s.textContent=items.length?`${items.length} inquiry${items.length===1?'':'ies'}`:'No inquiries yet.';box.innerHTML=items.map(x=>`<article class="inquiry"><div class="inquiry-head"><div><strong>${esc(x.name)}</strong><div><a class="email" href="mailto:${encodeURIComponent(x.email)}">${esc(x.email)}</a></div></div><time>${esc(new Date(x.createdAt).toLocaleString())}</time></div><div class="subject">${esc(x.subject)}</div><div class="message">${esc(x.message)}</div></article>`).join('')}async function load(){const r=await fetch('/api/admin/content',{cache:'no-store'});if(!r.ok)throw new Error('Not logged in');const c=await r.json();for(const[k,v]of Object.entries(c)){if(form.elements[k])form.elements[k].value=v}$('#login').style.display='none';$('#editor').style.display='block';await loadInbox()}async function login(){const s=$('#loginStatus');s.textContent='Signing in…';const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#password').value})});const j=await r.json().catch(()=>({}));if(!r.ok){s.textContent=j.error||'Login failed';return}s.textContent='';await load()}$('#loginBtn').onclick=login;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#refreshInbox').onclick=loadInbox;form.onsubmit=async e=>{e.preventDefault();const s=$('#saveStatus');s.textContent='Saving…';const data=Object.fromEntries(new FormData(form));const r=await fetch('/api/admin/content',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));s.textContent=r.ok?'Saved. Public content is now updated.':(j.error||'Save failed')};load().catch(()=>{});</script></body></html>
